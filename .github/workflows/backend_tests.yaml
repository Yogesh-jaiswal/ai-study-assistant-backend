name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mode: [sync, async]

    env:
      ENVIRONMENT: testing
      HF_HOME: ~/.cache/huggingface

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Copy testing environment
        run: cp .env.testing .env

      - name: Start Docker services
        run: docker compose -f docker/compose.yaml up -d

      - name: Wait for Redis
        run: |
          REDIS_CONTAINER=$(docker compose -f docker/compose.yaml ps -q redis)

          timeout 60 bash -c '
          until [ "$(docker inspect -f "{{.State.Health.Status}}" '"$REDIS_CONTAINER"')" = "healthy" ]
          do
            sleep 1
          done
          '

      - name: Wait for PostgreSQL
        run: |
          DB_CONTAINER=$(docker compose -f docker/compose.yaml ps -q db)

          timeout 60 bash -c '
          until [ "$(docker inspect -f "{{.State.Health.Status}}" '"$DB_CONTAINER"')" = "healthy" ]
          do
            sleep 1
          done
          '

      - name: Run Sync Tests
        if: matrix.mode == 'sync'
        run: |
          python -m pytest -s tests/

      - name: Run Async Tests
        if: matrix.mode == 'async'
        run: |
          python -m pytest -vv tests/ --async-tasks

      - name: Save Docker logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs > docker.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.mode }}
          path: docker.log

      - name: Stop Docker
        if: always()
        run: docker compose -f docker/compose.yaml down -v

defaults:
  run:
    shell: bash
    